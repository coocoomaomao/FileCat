name: Desktop Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["package.json","electron/**","build/**","scripts/**","index.html","styles.css","app.js",".github/workflows/desktop-build.yml"]
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: npm run dist:win
      - name: Collect installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          $installer = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          Copy-Item $installer.FullName -Destination "release-files/FileCat-Setup-v$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: FileCat-Windows
          path: release-files/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $asset = "release-files/FileCat-Setup-v$version.exe"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "FileCat 文件整理猫 v$version" --notes "Windows x64 安装版。v0.1 只整理用户主动选择目录的当前层文件，不进入已有子目录、不永久删除，支持整理预览、重复检测与一键撤销。"
          }
